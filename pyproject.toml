[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuhregex"
version = "0.3.0"
description = "Test expressions with the regular expression engines supported by Wazuh"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "Zafer Balkan", email = "zafer@zaferbalkan.com" },
]
keywords = ["wazuh", "regex", "pcre2", "security", "ossec"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pcre2>=0.6,<0.7",
  "rich>=13,<16",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["build>=1.2", "twine>=5"]

[project.scripts]
wazuhregex = "wazuhregex.cli:main"

[project.urls]
Homepage = "https://github.com/zbalkan/wazuhregex"
Repository = "https://github.com/zbalkan/wazuhregex"
Issues = "https://github.com/zbalkan/wazuhregex/issues"

[tool.mypy]
# Built distributions duplicate the src-layout package and must not be treated
# as an additional source tree when mypy is invoked from the repository root.
exclude = ["^build/", "^dist/"]


[[tool.mypy.overrides]]
module = ["pcre2.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]
